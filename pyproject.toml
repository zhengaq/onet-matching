[project]
name = "onet-matching"
version = "0.2.0"
description = "Match free-text survey job titles to O*NET occupations for human review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # numpy 2 changed scalar type promotion, which can shift scores.
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "tqdm>=4.65",
    "pyreadstat>=1.2,<2.0",
    "openpyxl>=3.1,<4.0",
    "torch>=2.0,<3.0",
    "sentence-transformers>=2.7,<3.0",
    "inflect>=7.0",
    "wordfreq>=3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CUDA 12.8 builds of torch run on current NVIDIA GPUs (including sm_120) and
# fall back to CPU. macOS has no CUDA builds and uses PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
